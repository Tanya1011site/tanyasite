<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兆豐真實行情 · 本機</title><style>body{font:16px system-ui;background:#f4f3ea;color:#303d36;max-width:1100px;margin:30px auto;padding:20px}section{background:white;border-radius:12px;padding:20px;margin:18px 0}h1{font-size:23px}#status{font-weight:bold}svg{background:#18251f;width:100%;border-radius:8px}label{display:inline-block;margin:10px}small{color:#73796c;line-height:1.8}.bad{color:#b65747}strong{font-size:30px}#mas{line-height:2}</style><h1>兆豐真實行情 · 本機看盤</h1><p id="status">連接中</p><section><span id="symbol"></span><br><strong id="price">—</strong><p id="time"></p><small>僅呈現收到的真實成交；不補入模擬歷史資料。</small></section><section><h2>一分鐘 K 線與均線</h2><div id="switches"></div><svg id="chart" viewBox="0 0 900 350" role="img" aria-label="真實成交 K 線與均線"></svg><div id="mas"></div><small>以本機接收時間分桶，並非交易所時間回補 K 線。請保持 Windows 時鐘準確；無成交分鐘不補 K 線。MA144 需累積至少 144 根有成交的 K 線。重啟程式會清除本次歷史。</small></section><section><h2>尚未接入</h2><p>選擇權未平倉、主力集中、BC / SC / BP / SP、大戶散戶：尚無已確認來源，這裡不顯示推造數值。</p><small>本機版本只供這台電腦使用。手機與 GitHub Pages 尚未連入；需另建受保護的遠端後端，並確認行情使用授權。</small></section><script>
const periods=[5,10,20,60,144],colors=['#e1ac46','#b986c9','#68a9d1','#ed985b','#cbd7bc'];const $=id=>document.getElementById(id);let snapshot=null;$('switches').innerHTML=periods.map((n,i)=>`<label style="color:${colors[i]}"><input id="ma${n}" type="checkbox" checked> MA${n}</label>`).join('');periods.forEach(n=>$('ma'+n).onchange=()=>{if(snapshot)render(snapshot)});
function render(s){snapshot=s;const bars=s.candles,visible=bars.slice(-80),offset=bars.length-visible.length;const stale=!s.lastReceipt||Date.now()-s.lastReceipt>60000;$('status').textContent=s.status+(!s.connected?' · 已離線':stale?' · 等待成交或資料超過 60 秒未更新':' · 接收中');$('status').className=(!s.connected||stale)?'bad':'';$('symbol').textContent=s.symbol||'尚未訂閱商品';$('price').textContent=bars.length?bars.at(-1).close.toLocaleString('zh-TW'):'—';$('time').textContent=s.lastReceipt?'最後接收：'+new Date(s.lastReceipt).toLocaleString('zh-TW')+'｜行情時間：'+s.matchTime:'等待第一筆真實成交';if(!bars.length){$('chart').innerHTML='<text x="30" y="80" fill="#bbcbbf">等待成交後顯示 K 線</text>';$('mas').textContent='尚無資料';return}const hi=Math.max(...visible.map(b=>b.high)),lo=Math.min(...visible.map(b=>b.low)),pad=Math.max((hi-lo)*.08,1),min=lo-pad,max=hi+pad;const y=v=>300-(v-min)/(max-min)*275,x=i=>15+i*790/Math.max(visible.length-1,1);let svg='';for(let i=0;i<5;i++){const v=min+(max-min)*i/4;svg+=`<line x1="10" x2="820" y1="${y(v)}" y2="${y(v)}" stroke="#344338"/><text x="830" y="${y(v)+4}" fill="#bbcbbf" font-size="12">${v.toFixed(1)}</text>`}visible.forEach((b,i)=>{const color=b.close>=b.open?'#df8073':'#73b98e';svg+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${color}"/><rect x="${x(i)-3}" y="${Math.min(y(b.open),y(b.close))}" width="6" height="${Math.max(1,Math.abs(y(b.open)-y(b.close)))}" fill="${color}"/>`;if(i%15===0)svg+=`<text x="${x(i)}" y="330" fill="#bbcbbf" font-size="10">${new Date(b.time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</text>`});$('mas').textContent=periods.map(n=>bars.length<n?`MA${n}：資料不足（${bars.length}/${n}）`:`MA${n}：${(bars.slice(-n).reduce((s,b)=>s+b.close,0)/n).toFixed(2)}`).join(' ｜ ');periods.forEach((n,j)=>{if(!$('ma'+n).checked)return;const pts=[];visible.forEach((b,i)=>{const end=offset+i;if(end>=n-1){const avg=bars.slice(end-n+1,end+1).reduce((s,b)=>s+b.close,0)/n;pts.push(`${x(i)},${y(avg)}`)}});if(pts.length)svg+=`<polyline points="${pts.join(' ')}" stroke="${colors[j]}" stroke-width="2" fill="none"/>`});$('chart').innerHTML=svg}
async function poll(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){$('status').textContent='本機行情程式無法連線，請確認程式仍開啟；畫面保留最後資料。';$('status').className='bad'}finally{setTimeout(poll,1000)}}poll();
</script></html>
